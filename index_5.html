:root{
  --noite:#08110F;
  --superficie:#10201C;
  --linha:#1B302A;
  --verde:#3BE08F;
  --coral:#FF6B4A;
  --nevoa:#F2FAF6;
  --suave:#8FA8A0;
  --corpo:#C6D8D1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--noite);color:var(--nevoa);
  font-family:'SpaceGrotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#app{max-width:520px;margin:0 auto;padding:26px 22px 60px;position:relative;}
.brilho{position:fixed;top:-120px;right:-140px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,224,143,.16),transparent 64%);
  animation:softglow 9s ease-in-out infinite;pointer-events:none;z-index:0;}
#app > *{position:relative;z-index:1;}

@keyframes dash{0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(-5px);opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(59,224,143,.45)}50%{box-shadow:0 0 0 10px rgba(59,224,143,0)}}
@keyframes softglow{0%,100%{opacity:.5}50%{opacity:.9}}
@keyframes crescer{from{width:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.display{font-family:'ArchivoBlack',Impact,sans-serif;font-weight:400;letter-spacing:-.03em;line-height:.92;}
.mono{font-family:'JetBrainsMono',ui-monospace,SFMono-Regular,Menlo,monospace;}
.rotulo{font-family:'JetBrainsMono',monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--suave);margin:0 0 18px;}
h1{font-family:'ArchivoBlack',Impact,sans-serif;font-weight:400;font-size:44px;
  line-height:.92;letter-spacing:-.03em;margin:0;}
h2{font-family:'ArchivoBlack',Impact,sans-serif;font-weight:400;font-size:26px;
  line-height:.98;letter-spacing:-.025em;margin:0 0 14px;}
h3{font-size:17px;font-weight:700;margin:0 0 8px;}
p{margin:0 0 14px;}
.tagline{font-family:'JetBrainsMono',monospace;font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--verde);margin:16px 0 0;}
.lead{font-size:15px;line-height:1.55;color:var(--corpo);}
.sub{font-size:14px;line-height:1.55;color:var(--suave);}

.carta{background:var(--superficie);border:1px solid var(--linha);border-radius:22px;padding:22px;margin-bottom:14px;}

.btn{display:block;width:100%;min-height:60px;padding:18px 22px;margin-bottom:12px;
  background:transparent;color:var(--nevoa);border:2px solid var(--linha);border-radius:999px;
  font-family:'SpaceGrotesk',sans-serif;font-weight:700;font-size:15px;line-height:1.35;
  text-align:center;cursor:pointer;transition:border-color .18s,background .18s,color .18s;}
.btn:active{transform:translateY(1px);}
.btn:focus-visible{outline:3px solid var(--verde);outline-offset:3px;}
.btn.principal{background:var(--verde);color:var(--noite);border-color:var(--verde);
  font-family:'ArchivoBlack',Impact,sans-serif;font-weight:400;font-size:18px;letter-spacing:.01em;}
.btn.contorno{border-color:var(--verde);}
.btn.escuro{background:var(--noite);color:var(--verde);border-color:var(--noite);
  font-family:'ArchivoBlack',Impact,sans-serif;font-size:18px;}
.btn.coral{background:var(--coral);color:var(--noite);border-color:var(--coral);
  font-family:'ArchivoBlack',Impact,sans-serif;font-size:18px;}
.btn.discreto{min-height:52px;font-weight:500;font-size:14px;color:var(--suave);border-color:var(--linha);}

/* alternativas de conduta */
.alt{display:flex;align-items:flex-start;gap:14px;width:100%;min-height:56px;
  background:var(--linha);color:var(--nevoa);border:1px solid transparent;border-radius:16px;
  padding:18px 20px;margin-bottom:10px;font-family:'SpaceGrotesk',sans-serif;font-size:15px;
  line-height:1.4;text-align:left;cursor:pointer;transition:border-color .18s;}
.alt:active{border-color:var(--verde);}
.alt:focus-visible{outline:3px solid var(--verde);outline-offset:3px;}
.alt .letra{font-family:'JetBrainsMono',monospace;font-size:14px;color:var(--suave);flex:none;padding-top:1px;}

/* paciente */
.paciente{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.ini{flex:none;width:52px;height:52px;border-radius:18px;background:var(--verde);color:var(--noite);
  display:flex;align-items:center;justify-content:center;
  font-family:'ArchivoBlack',Impact,sans-serif;font-size:22px;}
.ini.vazio{background:transparent;border:2px dashed var(--linha);color:var(--suave);}

/* ficha de indicadores */
.ficha{display:grid;gap:11px;}
.ind .top{display:flex;justify-content:space-between;align-items:baseline;
  font-family:'JetBrainsMono',monospace;font-size:12px;color:var(--suave);}
.ind .top b{font-weight:400;color:var(--nevoa);font-size:14px;}
.ind .top b.risco{color:var(--coral);}
.ind .top b.ok{color:var(--verde);}
.trilho{height:10px;border-radius:999px;background:var(--linha);overflow:hidden;margin-top:6px;}
.trilho > i{display:block;height:100%;border-radius:999px;background:var(--verde);
  transition:width .5s ease;animation:crescer .9s ease-out;}
.trilho > i.risco{background:var(--coral);}
.mov{font-family:'JetBrainsMono',monospace;font-size:12px;margin-top:5px;}
.mov.bom{color:var(--verde);} .mov.mau{color:var(--coral);} .mov.nulo{color:var(--suave);}

/* telas de retorno */
.acerto{background:var(--verde);color:var(--noite);border-radius:28px;padding:26px 24px;margin-bottom:14px;}
.acerto .rotulo{color:rgba(8,17,15,.6);}
.acerto .lead{color:var(--noite);}
.erro{background:var(--noite);border:2px solid var(--coral);border-radius:28px;padding:26px 24px;margin-bottom:14px;}
.erro .rotulo{color:var(--coral);}
.bang{width:58px;height:58px;border-radius:18px;border:3px solid var(--coral);color:var(--coral);
  display:flex;align-items:center;justify-content:center;
  font-family:'ArchivoBlack',Impact,sans-serif;font-size:28px;margin-bottom:18px;}

.fisio{background:var(--superficie);border-left:4px solid var(--verde);border-radius:0 16px 16px 0;
  padding:18px 20px;margin-bottom:14px;font-size:15px;line-height:1.5;color:var(--corpo);}
.fisio .tit{font-family:'JetBrainsMono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--verde);margin-bottom:8px;}
.fisio.claro{background:rgba(8,17,15,.14);border-left-color:var(--noite);color:var(--noite);}
.fisio.claro .tit{color:var(--noite);}

.fonte{font-family:'JetBrainsMono',monospace;font-size:11px;line-height:1.6;color:var(--suave);
  border-top:1px solid var(--linha);padding-top:14px;margin-top:4px;}
.acerto .fonte{color:rgba(8,17,15,.65);border-top-color:rgba(8,17,15,.2);}

/* etiquetas e medalhas */
.tags{display:flex;flex-wrap:wrap;gap:9px;}
.tag{font-family:'JetBrainsMono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--linha);color:var(--suave);border-radius:999px;padding:9px 15px;}
.tag.viva{color:var(--verde);}
.medalhas{display:flex;gap:12px;}
.medalha{flex:1;aspect-ratio:1/1;max-height:88px;border-radius:22px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;}
.medalha .sigla{font-family:'ArchivoBlack',Impact,sans-serif;font-size:20px;}
.medalha .leg{font-family:'JetBrainsMono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;}
.medalha.ganha{background:var(--verde);color:var(--noite);}
.medalha.aberta{border:2px dashed var(--linha);color:var(--suave);}

.aviso{background:var(--superficie);border:1px solid var(--coral);border-radius:18px;
  padding:18px 20px;margin-bottom:14px;font-size:14px;line-height:1.55;color:var(--corpo);}
.aviso b{color:var(--coral);font-family:'JetBrainsMono',monospace;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:8px;}

.placar{font-family:'ArchivoBlack',Impact,sans-serif;font-size:58px;line-height:.9;
  letter-spacing:-.04em;color:var(--verde);}
.placar span{font-family:'JetBrainsMono',monospace;font-size:16px;color:var(--suave);letter-spacing:0;}
ul{margin:0 0 14px;padding-left:20px;} li{margin-bottom:10px;line-height:1.5;}
.rodape{text-align:center;font-family:'JetBrainsMono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--suave);margin-top:28px;line-height:2;}
@media (min-width:560px){ h1{font-size:56px;} #app{padding:36px 26px 70px;} }
</style>

<div class="brilho"></div>
<div id="app"></div>
<script>
"use strict";
/* ====================================================================
   ALÉM DO REMÉDIO — Movimento é conduta
   Jogo educativo · Fisioterapia na Atenção Primária à Saúde
   Identidade visual aplicada conforme o guia "Identidade Além do Remédio".
   Todo número de desfecho vem de diretriz brasileira citada na própria tela.
   ==================================================================== */
var CASOS = {

  /* ---------------- HIPERTENSÃO ARTERIAL ---------------- */
  marta: {
    id:"marta", nome:"Dona Marta", inicial:"M", idade:62,
    condicao:"Hipertensão arterial",
    resumo:"Aposentada, mora com a filha. Descobriu a pressão alta há 4 anos numa campanha na UBS. Toma o remédio quase todo dia, mas nunca conversou com ninguém sobre o resto.",
    medidores:[
      {meta:140, ch:"pas", rot:"Pressão sistólica", un:"mmHg", ini:152, melhor:"menor"},
      {meta:90, ch:"pad", rot:"Pressão diastólica", un:"mmHg", ini:94,  melhor:"menor"}
    ],
    rodadas:[
      {
        titulo:"O tempero da casa",
        situacao:"Na visita domiciliar, Marta conta que usa caldo em cubo, tempero pronto e um pouco de sal em quase toda comida. Ela acha que come pouco sal porque \"quase não põe sal na mesa\".",
        opcoes:[
          { texto:"Explicar que a maior parte do sódio está no tempero pronto e no embutido, e ajudar a família a chegar perto de 5 g de sal por dia — uma colher de chá rasa no total.",
            certa:true, pontos:20, delta:{pas:-4, pad:-2},
            fb:"É onde está o sódio de verdade. Reduzir cerca de 1,75 g de sódio por dia (mais ou menos 4,4 g de sal) derruba em média 4,2 mmHg a pressão sistólica e 2,1 mmHg a diastólica.",
            fisio:"O fisioterapeuta na Atenção Primária não fica só no exercício: ele participa da educação em saúde do grupo e da visita domiciliar, e é quem costuma ter mais tempo de contato com a pessoa para transformar a orientação em rotina.",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." },
          { texto:"Dizer para ela trocar o sal comum pelo sal light e manter todo o resto igual.",
            certa:false, pontos:5, delta:{pas:-1, pad:0},
            fb:"Ajuda um pouco, mas erra o alvo. Se o caldo em cubo e o embutido continuam, a troca do saleiro mexe na menor parte do sódio que ela consome. A conta é a quantidade total, não a marca do sal.",
            fisio:"Orientação genérica é o tipo de conselho que a pessoa escuta e não consegue aplicar. Parte da atuação na APS é justamente traduzir a meta para a comida daquela casa.",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." },
          { texto:"Não falar de comida — isso é assunto da nutricionista, não da fisioterapia.",
            certa:false, pontos:0, delta:{pas:0, pad:0},
            fb:"O encaminhamento para a nutricionista é correto e necessário. Recusar a conversa não é. Na equipe multiprofissional, todo mundo reforça a mesma mensagem; se cada profissional só fala da própria caixinha, a pessoa recebe orientação picada e não muda nada.",
            fisio:"O documento de linhas de cuidado é direto nisso: equipe incompleta ou fragmentada é limitadora do cuidado da doença crônica.",
            fonte:"Panorama IEPS — Linhas de Cuidado de DCNT na APS, p. 13." }
        ]
      },
      {
        titulo:"\"Caminhar resolve alguma coisa?\"",
        situacao:"Marta pergunta, meio desconfiada, se andar no fim da tarde muda mesmo alguma coisa na pressão dela ou se é só conversa.",
        opcoes:[
          { texto:"Combinar 150 minutos por semana de caminhada em ritmo moderado — cerca de 30 minutos em 5 dias — e explicar o quanto isso costuma baixar a pressão.",
            certa:true, pontos:25, delta:{pas:-6, pad:-3},
            fb:"Muda, e muda bastante. Exercício aeróbico regular nessa dose reduz de 5 a 7 mmHg a pressão sistólica e cerca de 3 mmHg a diastólica. É o efeito de um remédio inteiro, obtido com caminhada.",
            fisio:"Aqui a fisioterapia está no centro: avaliar se ela pode fazer o exercício, escolher a intensidade, ajustar a progressão e acompanhar. Não é \"mandar caminhar\" — é prescrever e supervisionar.",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." },
          { texto:"Dizer para ela caminhar o máximo que aguentar, todo dia, o mais rápido possível.",
            certa:false, pontos:5, delta:{pas:-2, pad:-1},
            fb:"Sem dose e sem progressão, quase sempre acaba em dor, desânimo ou abandono na segunda semana. E numa senhora de 62 anos sem avaliação prévia, intensidade alta de largada é risco, não zelo.",
            fisio:"A diferença entre conselho e prescrição é exatamente esta: quantidade, intensidade, frequência e progressão definidas por quem avaliou a pessoa.",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." },
          { texto:"Responder que exercício é bom para a saúde em geral, mas quem baixa a pressão é o remédio.",
            certa:false, pontos:0, delta:{pas:0, pad:0},
            fb:"Falso, e é justamente o que este jogo existe para desmontar. O exercício tem efeito próprio e mensurável sobre a pressão. Ele não substitui o remédio, mas também não é enfeite.",
            fisio:"Quando o profissional passa essa mensagem, a pessoa entende que só o comprimido importa — e para de tentar qualquer outra coisa.",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." }
        ]
      },
      {
        titulo:"Quatro quilos",
        situacao:"Marta está com 78 kg. Ela pergunta se vale a pena tentar emagrecer, porque já tentou muitas vezes e sempre desistiu.",
        opcoes:[
          { texto:"Propor uma meta pequena e possível — cerca de 4 kg — e explicar que cada quilo perdido derruba em torno de 1 mmHg de pressão.",
            certa:true, pontos:20, delta:{pas:-4, pad:-2},
            fb:"Meta pequena é meta que se cumpre. A relação de aproximadamente 1 mmHg por quilo perdido deixa o esforço visível: 4 kg viram 4 mmHg, e ela consegue enxergar isso acontecendo.",
            fisio:"Quem acompanha a evolução do peso, da circunferência e da tolerância ao exercício semana a semana é a equipe da APS. O retorno concreto é o que sustenta a adesão.",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." },
          { texto:"Dizer que ela precisa perder pelo menos 20 kg para ver resultado.",
            certa:false, pontos:0, delta:{pas:0, pad:0},
            fb:"Meta grande demais desanima antes de começar — e é imprecisa. O benefício sobre a pressão começa nos primeiros quilos, não lá na frente.",
            fisio:"Estabelecer meta inalcançável é uma forma silenciosa de empurrar a culpa para a pessoa quando ela não chega lá.",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." },
          { texto:"Deixar o peso de lado: o que importa é a pressão.",
            certa:false, pontos:5, delta:{pas:0, pad:0},
            fb:"Peso e pressão andam juntos. Ignorar um dos dois é abrir mão de um efeito que já está comprovado e não custa nada.",
            fisio:"",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." }
        ]
      },
      {
        titulo:"A cerveja de domingo",
        situacao:"O genro conta que Marta toma três ou quatro latas de cerveja nos domingos de futebol. Ela acha que, por ser só uma vez na semana, não conta.",
        opcoes:[
          { texto:"Conversar sem julgamento e propor reduzir, explicando o limite recomendado para mulheres e o efeito da redução sobre a pressão.",
            certa:true, pontos:15, delta:{pas:-4, pad:-2},
            fb:"Reduzir o consumo de álcool baixa de 4 a 5 mmHg a pressão sistólica. O limite recomendado é de até 30 g de álcool por dia para homens e metade disso para mulheres — cerca de uma lata de cerveja.",
            fisio:"Abordar álcool sem moralismo é parte da educação em saúde. Sermão fecha a porta e a pessoa passa a esconder o consumo, o que piora o cuidado.",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." },
          { texto:"Avisar que ela precisa parar de beber completamente, ou vai ter um AVC.",
            certa:false, pontos:0, delta:{pas:0, pad:0},
            fb:"Ameaça não é intervenção. A recomendação é de redução com limite definido, não de abstinência total para todo hipertenso — e o medo, isolado, produz mais abandono do acompanhamento do que mudança.",
            fisio:"O documento de linhas de cuidado registra que baixa adesão costuma ser tratada como teimosia da pessoa, quando muitas vezes é resposta ao jeito como ela foi abordada.",
            fonte:"Panorama IEPS — Linhas de Cuidado de DCNT na APS, p. 14 e 22." },
          { texto:"Não comentar nada, para não constranger.",
            certa:false, pontos:0, delta:{pas:0, pad:0},
            fb:"Silêncio também é uma escolha, e aqui é a errada. Dá para tocar no assunto com respeito e sem constrangimento — deixar de tocar é abrir mão de 4 a 5 mmHg.",
            fisio:"",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." }
        ]
      },
      {
        titulo:"\"Posso parar o remédio?\"",
        situacao:"Três meses depois. A pressão de Marta caiu bastante. Animada, ela pergunta se agora já pode parar o comprimido, já que está tudo indo bem sem ele.",
        opcoes:[
          { texto:"Explicar que não se para remédio por conta própria, comemorar a conquista dela e encaminhar para o médico reavaliar a dose com esses novos números.",
            certa:true, pontos:25, delta:{pas:-2, pad:-1},
            fb:"Esta é a rodada mais importante do jogo. Mudança de estilo de vida caminha COM o medicamento, não no lugar dele. Quem ajusta ou suspende dose é o médico, olhando os números atuais. O que Marta conquistou é justamente o que torna essa conversa possível.",
            fisio:"Reconhecer o limite da própria atuação e encaminhar na hora certa é parte do trabalho. Isso é coordenação do cuidado, não é passar a bola.",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." },
          { texto:"Dizer que sim — ela provou que dá para controlar sem remédio.",
            certa:false, pontos:-20, delta:{pas:14, pad:8},
            fb:"Não. Suspender anti-hipertensivo por conta própria faz a pressão voltar a subir, e nenhum profissional que não seja o prescritor pode autorizar isso. Repare no que aconteceu com os números dela agora.",
            fisio:"Interromper medicamento está fora do escopo de qualquer profissional que não o prescreveu. \"Além dos medicamentos\" quer dizer somado a eles, nunca no lugar deles.",
            fonte:"Diretriz Brasileira de Hipertensão Arterial, SBC, 2020." },
          { texto:"Responder que não e mudar de assunto.",
            certa:false, pontos:5, delta:{pas:0, pad:0},
            fb:"A negativa está certa, mas a pergunta ficou sem resposta. Sem entender o porquê, ela tem grande chance de parar sozinha em casa e não contar a ninguém.",
            fisio:"Explicar o motivo é o que separa a ordem da educação em saúde.",
            fonte:"Panorama IEPS — Linhas de Cuidado de DCNT na APS, p. 22." }
        ]
      }
    ],
    fecho:"A pressão de Marta caiu porque alguém sentou com ela e transformou orientação solta em rotina possível. Nada disso substituiu o remédio dela — e é exatamente esse o ponto."
  },

  /* ---------------- DIABETES MELLITUS TIPO 2 ---------------- */
  jorge: {
    id:"jorge", nome:"Seu Jorge", inicial:"J", idade:54,
    condicao:"Diabetes mellitus tipo 2",
    resumo:"Motorista de van escolar. Diagnóstico há 6 anos. Passa mais de 10 horas por dia sentado. Diz que não tem tempo para academia e que já se conformou com os números.",
    medidores:[
      {meta:7, ch:"hba1c", rot:"Hemoglobina glicada", un:"%", ini:8.4, melhor:"menor", dec:1},
      {meta:130, ch:"gli",   rot:"Glicemia de jejum",   un:"mg/dL", ini:168, melhor:"menor"}
    ],
    rodadas:[
      {
        titulo:"Dez horas sentado",
        situacao:"Jorge dirige o dia inteiro e diz que não tem como treinar. Ele pergunta o que dá para fazer alguém como ele, que passa o dia dentro de uma van.",
        opcoes:[
          { texto:"Mostrar que o tempo sentado é problema por si só, e combinar uma pausa a cada 30 minutos com alguma movimentação leve entre um trajeto e outro.",
            certa:true, pontos:20, delta:{hba1c:-0.2, gli:-8},
            fb:"Comportamento sedentário é fator de risco independente. A recomendação é interromper o tempo sentado a cada 30 minutos com atividade de pelo menos 1,5 MET — que é pouco mais do que ficar de pé e andar um pouco.",
            fisio:"Encaixar movimento na rotina real da pessoa, em vez de propor uma rotina que ela não tem, é trabalho de avaliação funcional. É onde a fisioterapia costuma resolver o que a orientação genérica não resolve.",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025 — atividade física no pré-diabetes e DM2." },
          { texto:"Orientar que ele se matricule numa academia perto de casa.",
            certa:false, pontos:0, delta:{hba1c:0, gli:0},
            fb:"Ele acabou de dizer que não tem tempo nem rotina para isso. Prescrever o que a pessoa já avisou que não consegue cumprir é como não prescrever nada — só que agora com a culpa transferida para ela.",
            fisio:"O documento de linhas de cuidado aponta que a não adesão é frequentemente tratada como falha da pessoa, quando é falha do plano que foi oferecido a ela.",
            fonte:"Panorama IEPS — Linhas de Cuidado de DCNT na APS, p. 22." },
          { texto:"Explicar que, no caso dele, só o ajuste do medicamento vai resolver.",
            certa:false, pontos:-5, delta:{hba1c:0, gli:0},
            fb:"Isso entrega o controle da doença inteiro para o comprimido e desmonta a única parte que Jorge poderia controlar sozinho.",
            fisio:"",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025." }
        ]
      },
      {
        titulo:"Caminhada",
        situacao:"Jorge topou tentar caminhar. Ele quer saber quanto precisa fazer para valer a pena.",
        opcoes:[
          { texto:"Combinar 150 minutos por semana em intensidade moderada, distribuídos de forma que ele nunca passe mais de 2 dias seguidos parado.",
            certa:true, pontos:25, delta:{hba1c:-0.3, gli:-18},
            fb:"É a dose recomendada, e o detalhe dos 2 dias importa: o efeito do exercício sobre a sensibilidade à insulina não dura a semana inteira. Exercício aeróbico isolado reduz a hemoglobina glicada em cerca de 0,3 ponto percentual.",
            fisio:"Distribuir a carga ao longo da semana em função do efeito fisiológico, e não da agenda, é decisão técnica.",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025." },
          { texto:"Sugerir que ele caminhe 3 horas seguidas no domingo, já que é o dia livre.",
            certa:false, pontos:5, delta:{hba1c:-0.1, gli:-4},
            fb:"Concentrar tudo num dia deixa seis dias sem efeito, e ainda aumenta o risco de lesão em quem estava parado. A recomendação é não ficar mais de 2 dias consecutivos sem atividade.",
            fisio:"",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025." },
          { texto:"Dizer que qualquer caminhada já está ótima, sem combinar quantidade.",
            certa:false, pontos:8, delta:{hba1c:-0.1, gli:-5},
            fb:"Melhor que nada, e vale reconhecer isso. Mas sem meta combinada não há como saber se ele está fazendo o suficiente, nem como progredir depois.",
            fisio:"",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025." }
        ]
      },
      {
        titulo:"Só caminhar basta?",
        situacao:"Dois meses depois, os números de Jorge melhoraram e estacionaram. Ele pergunta se dá para melhorar mais.",
        opcoes:[
          { texto:"Acrescentar exercício resistido: pelo menos 5 exercícios, de 10 a 15 repetições, 2 a 3 vezes por semana, em dias não consecutivos.",
            certa:true, pontos:25, delta:{hba1c:-0.4, gli:-20},
            fb:"O treino combinado — aeróbico mais resistido — reduz a hemoglobina glicada mais do que qualquer uma das modalidades sozinha. O músculo é o principal destino da glicose do corpo; ganhar músculo melhora o controle glicêmico.",
            fisio:"Prescrever carga, número de séries, repetições e progressão para um homem de 54 anos com diabetes há 6 anos é atribuição técnica. Não é planilha de internet.",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025." },
          { texto:"Aumentar a caminhada para 300 minutos por semana.",
            certa:false, pontos:12, delta:{hba1c:-0.15, gli:-8},
            fb:"Traz algum ganho, mas ignora a via mais eficiente. Somar o exercício resistido rende mais do que dobrar o aeróbico — e cabe melhor na agenda de quem trabalha o dia inteiro.",
            fisio:"",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025." },
          { texto:"Explicar que ele chegou no limite do que dá para conseguir sem mexer na medicação.",
            certa:false, pontos:0, delta:{hba1c:0, gli:0},
            fb:"Não chegou. Faltava a metade do plano.",
            fisio:"",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025." }
        ]
      },
      {
        titulo:"O pé",
        situacao:"Numa consulta, Jorge tira o sapato e você vê um calo grande sob o antepé direito. Ele diz que não sente nada ali e que nunca ninguém olhou o pé dele.",
        opcoes:[
          { texto:"Avaliar a sensibilidade com o monofilamento de 10 g, orientar inspeção diária dos pés e definir a periodicidade de acompanhamento pela categoria de risco.",
            certa:true, pontos:30, delta:{hba1c:0, gli:0},
            fb:"Calo em área de pressão somado à perda de sensibilidade é o caminho clássico da úlcera. Entre 19% e 34% das pessoas com diabetes desenvolvem úlcera ao longo da vida, e 40% de quem já teve uma tem outra dentro de um ano. O exame conforme o risco vai de anual até a cada 1 a 3 meses.",
            fisio:"Rastreio de neuropatia periférica, avaliação da marcha e da distribuição de carga no pé, e orientação de calçado estão no núcleo da fisioterapia. Este é o momento em que ela evita uma amputação — e não aparece em nenhum medidor da tela.",

          { texto:"Orientar que ele passe hidratante e volte se doer.",

            fb:"\"Volte se doer\" é a orientação mais perigosa possível para um pé sem sensibilidade. Ele não vai sentir dor — é esse o problema. A ferida vai aparecer sem aviso.",
            fisio:"Perder este rastreio é perder a chance de prevenir a complicação mais incapacitante do diabetes.",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025." },
          { texto:"Encaminhar para o médico e não examinar.",
            certa:false, pontos:8, delta:{hba1c:0, gli:0},
            fb:"O encaminhamento está certo, mas o exame do pé não é exclusivo do médico, e a fila pode levar meses. Examinar agora e encaminhar com o achado descrito vale muito mais do que encaminhar em branco.",
            fisio:"",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025." }
        ]
      },
      {
        titulo:"Qual é a meta?",
        situacao:"Jorge quer saber até onde precisa chegar. \"Quando é que eu posso dizer que está controlado?\"",
        opcoes:[
          { texto:"Explicar que a meta geral de hemoglobina glicada é abaixo de 7%, e que ela pode ser individualizada conforme o risco de hipoglicemia dele.",
            certa:true, pontos:20, delta:{hba1c:-0.2, gli:-10},
            fb:"Meta clara transforma um exame abstrato em algo que a pessoa acompanha. Além disso: glicemia de jejum entre 80 e 130 mg/dL e, duas horas depois de comer, abaixo de 180 mg/dL.",
            fisio:"Saber a meta e o significado do exame permite que a equipe inteira reforce a mesma mensagem, em vez de cada profissional dizer uma coisa.",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025 — metas no tratamento." },
          { texto:"Dizer que o ideal é zerar a glicemia.",
            certa:false, pontos:-10, delta:{hba1c:0, gli:0},
            fb:"Glicose baixa demais é hipoglicemia, que é uma emergência. A meta é uma faixa, nunca o menor número possível.",
            fisio:"",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025." },
          { texto:"Responder que quem define a meta é o médico e ele deve perguntar na consulta.",
            certa:false, pontos:5, delta:{hba1c:0, gli:0},
            fb:"A meta é definida com o médico, sim. Mas explicar o que ela significa não invade a competência de ninguém — e a próxima consulta dele pode demorar.",
            fisio:"",
            fonte:"Diretriz da Sociedade Brasileira de Diabetes, edição 2025." }
        ]
      }
    ],
    fecho:"O melhor que aconteceu com Jorge não aparece em nenhum medidor: alguém olhou o pé dele antes de a ferida existir."
  },

/* logotipo: halter cujos discos sao capsulas de medicamento, com tracos de movimento.
   O exercicio entra no plano de cuidado junto com a medicacao, nao no lugar dela. */
function halter(cor, esp){
  return '<g transform="translate(46 0)" fill="none" stroke="'+cor+'" stroke-width="'+esp+'" '
    + 'stroke-linecap="round" stroke-linejoin="round">'
    + '<line x1="38" y1="60" x2="82" y2="60"></line>'
    + '<rect x="10" y="18" width="28" height="84" rx="14"></rect>'
    + '<line x1="10" y1="42" x2="38" y2="42"></line>'
    + '<rect x="82" y="18" width="28" height="84" rx="14"></rect>'
    + '<line x1="82" y1="42" x2="110" y2="42"></line></g>';
}
function marca(alt, cor, tracos, animar){
  cor = cor || "#3BE08F"; tracos = tracos || "#8FA8A0";
  var larg = Math.round(alt * 170 / 120), esp = 7;
  var a1 = animar ? ' style="animation:dash 3.2s ease-in-out infinite"' : '';
  var a2 = animar ? ' style="animation:dash 3.2s ease-in-out .4s infinite"' : '';
  return '<svg width="'+larg+'" height="'+alt+'" viewBox="0 0 170 120" aria-hidden="true" style="flex:none;display:block">'
    + '<g stroke="'+tracos+'" stroke-width="'+esp+'" stroke-linecap="round">'
    + '<line x1="4" y1="46" x2="30" y2="46"'+a1+'></line>'
    + '<line x1="4" y1="70" x2="22" y2="70"'+a2+'></line></g>'
    + halter(cor, esp) + '</svg>';
}

var E = {};
function zerar(){ E = { tela:"inicio", caso:null, rodada:0, escolha:null, med:{}, pontos:0, maxPontos:0, feitos:[], acertos:0, ultimoDelta:null }; }
zerar();

function pontosMaximos(c){
  var t=0;
  c.rodadas.forEach(function(r){ var m=0; r.opcoes.forEach(function(o){ if(o.pontos>m) m=o.pontos; }); t+=m; });
  return t;
}
function fmt(v,dec){ return dec ? v.toFixed(dec).replace(".",",") : String(Math.round(v)); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function pct(m){
  var ini = m.ini, atual = E.med[m.ch], meta = m.meta;
  if(ini === meta) return 100;
  var p = (ini - atual) / (ini - meta) * 100;
  return Math.max(0, Math.min(100, Math.round(p)));
}
function naMeta(m){ return E.med[m.ch] <= m.meta; }

/* --------------------------- componentes -------------------------------- */
function ficha(c, mostrarMov){
  var h = '<div class="ficha">';
  c.medidores.forEach(function(m){
    var v = E.med[m.ch], ok = naMeta(m), p = pct(m);
    h += '<div class="ind">';
    h += '<div class="top"><span>'+esc(m.rot)+'</span><b class="'+(ok?'ok':'risco')+'">'+fmt(v,m.dec)+' '+esc(m.un)+'</b></div>';
    h += '<div class="trilho"><i class="'+(ok?'':'risco')+'" style="width:'+Math.max(p,3)+'%"></i></div>';
    if(mostrarMov){
      var d = E.ultimoDelta ? (E.ultimoDelta[m.ch]||0) : 0;
      if(d){
        var bom = (m.melhor==="menor") ? d<0 : d>0;
        h += '<div class="mov '+(bom?'bom':'mau')+'">'+(d>0?'+':'−')+fmt(Math.abs(d),m.dec)+' '+esc(m.un)+'</div>';
      } else { h += '<div class="mov nulo">sem mudança</div>'; }
    }
    h += '</div>';
  });
  return h + '</div>';
}

function medalhas(){
  var h = '<div class="medalhas">';
  ORDEM.forEach(function(k){
    var g = E.feitos.indexOf(k)>=0;
    h += '<div class="medalha '+(g?'ganha':'aberta')+'"><span class="sigla">'+SIGLA[k].s+'</span>'
       + '<span class="leg">'+(g?SIGLA[k].leg:"bloqueada")+'</span></div>';

  return h + '</div>';
}

    h += '<b class="'+(naMeta(m)?'ok':'risco')+'"><span class="mono" style="color:var(--suave);font-size:12px">'+fmt(ini,m.dec)+' → </span>'+fmt(fim,m.dec)+' '+esc(m.un)+'</b></div>';
    h += '<div class="trilho"><i class="'+(naMeta(m)?'':'risco')+'" style="width:'+Math.max(pct(m),3)+'%"></i></div>';
    h += '<div class="mov '+(d===0?'nulo':(bom?'bom':'mau'))+'">'+(d===0?'sem mudança':(d>0?'+':'−')+fmt(Math.abs(d),m.dec)+' '+esc(m.un))+'</div>';
    h += '</div>';
  });
  h += '</div></div>';

  h += '<div class="carta"><p class="rotulo">Medalha</p>'+medalhas()+'</div>';
  h += '<p class="lead">'+esc(c.fecho)+'</p>';
  h += '<div class="aviso"><b>Não esqueça</b>Tudo o que moveu esses números foi somado ao tratamento medicamentoso, nunca no lugar dele. Quem inicia, ajusta ou suspende medicamento é o médico.</div>';
  h += '<button class="btn principal" data-acao="voltar">VOLTAR AOS ATENDIMENTOS</button>';
  h += '<button class="btn discreto" data-acao="refazer">Refazer o caso de '+esc(c.nome)+'</button>';
  return h;
}

/* ---------------------------- controle ---------------------------------- */
function render(){
  var t = E.tela, h;
  if(t==="inicio") h = telaInicio();
  else if(t==="rodada") h = telaRodada();
  else if(t==="feedback") h = telaFeedback();
  else if(t==="resultado") h = telaResultado();
  else if(t==="final") h = telaFinal();
  else h = telaCreditos();
  document.getElementById("app").innerHTML = h;
  window.scrollTo(0,0);
}

function iniciarCaso(k){
  var c = CASOS[k];
  E.caso = k; E.rodada = 0; E.pontos = 0; E.acertos = 0;
  E.maxPontos = pontosMaximos(c); E.med = {}; E.ultimoDelta = null;
  c.medidores.forEach(function(m){ E.med[m.ch] = m.ini; });
  E.tela = "rodada";
}

document.addEventListener("click", function(ev){
  var b = ev.target.closest("button[data-acao]");
  if(!b) return;
  var a = b.getAttribute("data-acao");

  if(a==="caso"){ iniciarCaso(b.getAttribute("data-caso")); }
  else if(a==="escolher"){
    var i = parseInt(b.getAttribute("data-i"),10);
    var c = CASOS[E.caso], o = c.rodadas[E.rodada].opcoes[i];
    E.escolha = i; E.pontos += o.pontos; if(o.certa) E.acertos++;
    E.ultimoDelta = {};
    for(var ch in o.delta){
      if(Object.prototype.hasOwnProperty.call(o.delta,ch)){
        E.med[ch] = Math.round((E.med[ch] + o.delta[ch]) * 10) / 10;
        E.ultimoDelta[ch] = o.delta[ch];
      }
    }
    E.tela = "feedback";
  }
  else if(a==="proxima"){
    var cc = CASOS[E.caso];
    if(E.rodada >= cc.rodadas.length-1){
      if(E.feitos.indexOf(E.caso)<0) E.feitos.push(E.caso);
      E.tela = "resultado";
    } else { E.rodada++; E.tela = "rodada"; }
  }
  else if(a==="refazer"){ iniciarCaso(E.caso); }
  else if(a==="voltar"){ E.tela = "inicio"; }
  else if(a==="final"){ E.tela = "final"; }
  else if(a==="creditos"){ E.tela = "creditos"; }

  render();
});

render();
</script>
